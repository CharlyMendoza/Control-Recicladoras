services:
  - type: web
    name: rutas-atencion-recicladoras
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PIN
        sync: false
      - key: DATABASE_URL
        sync: false
