<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresar - Rutas de Atencion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/vendor/tailwind.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-3xl mb-2"></div>
      <h1 class="text-lg font-bold text-slate-800">Rutas de Atencion</h1>
      <p class="text-xs text-slate-500">Recicladoras Bloque 2 y 3</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-600 text-sm rounded-lg px-3 py-2 mb-4 border border-red-200">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tu nombre</label>
        <input type="text" name="nombre" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071CE]"
               placeholder="Ej. Juan Perez" autofocus>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">PIN de acceso</label>
        <input type="password" name="pin" required inputmode="numeric"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071CE]"
               placeholder="****">
      </div>
      <button type="submit"
              class="w-full bg-[#0071CE] text-white font-semibold rounded-lg py-2 text-sm hover:bg-[#005ba1] transition">
        Entrar
      </button>
    </form>
    <p class="text-[11px] text-slate-400 text-center mt-4">
      El PIN te lo comparte quien administra el proyecto.
    </p>
  </div>
</body>
</html>
