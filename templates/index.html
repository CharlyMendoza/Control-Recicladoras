<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rutas de Atencion - Recicladoras Bloque 2 y 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0071CE">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<script src="/static/vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="/static/vendor/tailwind.css">
<style>
  html, body { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; }
  #map { height: 100%; width: 100%; }
  .leaflet-popup-content { font-size: 13px; }
  .progress-bar-bg { background: #E2E8F0; border-radius: 9999px; overflow: hidden; }
  .progress-bar-fill { transition: width 0.4s ease; }
  .store-row:hover { background: #F1F5F9; }
  .tab-btn.active { background: #0071CE; color: white; }
  @media (min-width: 768px) {
    .mobile-only { display: none !important; }
  }
  @media (max-width: 767px) {
    #map-view.hidden-mobile, #panel-view.hidden-mobile { display: none !important; }
  }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div class="flex flex-col h-screen">
  <header class="bg-[#0071CE] text-white px-4 md:px-6 py-3 shadow-md z-[1100]">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-base md:text-xl font-bold leading-tight">Rutas de Atencion</h1>
        <p class="text-[11px] md:text-xs text-blue-100">Recicladoras Bloque 2 y 3</p>
      </div>
      <div class="flex items-center gap-3 md:gap-6 text-center">
        <div>
          <div class="text-lg md:text-2xl font-bold" id="kpi-total">-</div>
          <div class="text-[10px] md:text-xs text-blue-100">Tiendas</div>
        </div>
        <div>
          <div class="text-lg md:text-2xl font-bold" id="kpi-global-pct">0%</div>
          <div class="text-[10px] md:text-xs text-blue-100">Atendido</div>
        </div>
        <div class="flex flex-col items-end">
          <span class="text-xs font-semibold">{{ user_name }}</span>
          <form method="post" action="/logout">
            <button class="text-[10px] text-blue-100 underline">Salir</button>
          </form>
        </div>
      </div>
    </div>
    <div class="mobile-only flex gap-2 mt-2">
      <button id="tab-map" class="tab-btn flex-1 text-xs font-semibold py-1.5 rounded-lg bg-white/20 active">Mapa</button>
      <button id="tab-list" class="tab-btn flex-1 text-xs font-semibold py-1.5 rounded-lg bg-white/20">Grupos</button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    <aside id="panel-view" class="hidden-mobile w-full md:w-96 bg-white border-r border-slate-200 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-200">
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Filtrar por grupo de ruta</label>
        <select id="group-filter" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071CE]">
          <option value="__all__">Ver todos los grupos</option>
        </select>
      </div>
      <div id="panel-content" class="flex-1 overflow-y-auto p-4">
        <!-- se llena dinamicamente -->
      </div>
    </aside>

    <main id="map-view" class="flex-1 relative">
      <div id="map"></div>
    </main>
  </div>
</div>

<script>
  const CURRENT_USER = {{ user_name|tojson }};
</script>
<script src="/static/app.js"></script>
</body>
</html>
